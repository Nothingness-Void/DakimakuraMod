plugins {
    id 'fabric-loom' version '1.14.10'
}

base {
    archivesName = "${mod_id}"
}

loom {
    accessWidenerPath = file('src/main/resources/dakimakuramod.accesswidener')
}

sourceSets {
    main {
        java {
            srcDir '../../common-shared/src/main/java'
            srcDir '../common/src/main/java'
        }
        resources {
            srcDir '../../common-shared/src/main/resources'
            srcDir '../common/src/main/resources'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            display_url: display_url,
            issue_tracker_url: issue_tracker_url
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('remapJar') {
    archiveFileName = "${mod_id}-${mod_version}+mc${minecraft_version}-fabric.jar"
}
