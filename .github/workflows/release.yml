name: Build and Release DakimakuraMod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0 or v1.0.0-beta.1). Leave empty to skip release.'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc_version: "1.20.1"
            loader: "forge"
            java_version: "17"
            working_directory: "mc1.20.1"
            task: ":forge:build"
            jar: "mc1.20.1/forge/build/libs/dakimakuramod-*+mc1.20.1-forge.jar"
          - mc_version: "1.20.1"
            loader: "fabric"
            java_version: "17"
            working_directory: "mc1.20.1"
            task: ":fabric:build"
            jar: "mc1.20.1/fabric/build/libs/dakimakuramod-*+mc1.20.1-fabric.jar"
          - mc_version: "1.21.1"
            loader: "neoforge"
            java_version: "21"
            working_directory: "mc1.21.1"
            task: ":neoforge:build"
            jar: "mc1.21.1/neoforge/build/libs/dakimakuramod-*+mc1.21.1-neoforge.jar"
          - mc_version: "1.21.1"
            loader: "fabric"
            java_version: "21"
            working_directory: "mc1.21.1"
            task: ":fabric:build"
            jar: "mc1.21.1/fabric/build/libs/dakimakuramod-*+mc1.21.1-fabric.jar"
          - mc_version: "1.21.1"
            loader: "forge"
            java_version: "21"
            working_directory: "mc1.21.1"
            task: ":forge:build"
            jar: "mc1.21.1/forge/build/libs/dakimakuramod-*+mc1.21.1-forge.jar"

    steps:
    - name: Checkout repository (${{ matrix.loader }} ${{ matrix.mc_version }})
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java_version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java_version }}
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew mc1.20.1/gradlew mc1.21.1/gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-root-directory: ${{ matrix.working_directory }}

    - name: Pre-cache vineflower for ForgeGradle Mavenizer
      if: matrix.loader == 'forge' && matrix.mc_version == '1.21.1'
      shell: bash
      run: |
        set -euo pipefail
        CACHE_DIR="$HOME/.gradle/caches/minecraftforge/forgegradle/mavenizer/caches/maven/mcp-tools/org/vineflower/vineflower/1.10.1"
        mkdir -p "$CACHE_DIR"
        curl -fsSL -o "$CACHE_DIR/vineflower-1.10.1.jar" \
          "https://repo.maven.apache.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar"
        sha1sum "$CACHE_DIR/vineflower-1.10.1.jar" | awk '{print $1}' > "$CACHE_DIR/vineflower-1.10.1.jar.sha1"
        echo "Pre-cached vineflower-1.10.1.jar from Maven Central"

    - name: Resolve build version
      id: build_version
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ github.event.inputs.version }}
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        version=""
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          version="$INPUT_VERSION"
        elif [[ "$REF" == refs/tags/* ]]; then
          version="$REF_NAME"
        fi

        if [ -n "$version" ]; then
          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "Error: version '$version' does not match the required format v<major>.<minor>.<patch> (e.g. v1.0.0 or v1.0.0-beta.1)"
            exit 1
          fi
          version="${version#v}"
        fi

        echo "value=$version" >> "$GITHUB_OUTPUT"

    - name: Build with Gradle
      working-directory: ${{ matrix.working_directory }}
      shell: bash
      env:
        BUILD_VERSION: ${{ steps.build_version.outputs.value }}
      run: |
        set -euo pipefail
        if [ -n "$BUILD_VERSION" ]; then
          ./gradlew -Pmod_version="$BUILD_VERSION" ${{ matrix.task }}
        else
          ./gradlew ${{ matrix.task }}
        fi

    - name: Upload build artifacts (${{ matrix.loader }} ${{ matrix.mc_version }})
      uses: actions/upload-artifact@v4
      with:
        name: DakimakuraMod-${{ matrix.mc_version }}-${{ matrix.loader }}
        path: ${{ matrix.jar }}
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')

    steps:
    - name: Resolve release tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          version="${{ inputs.version }}"
          if ! echo "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "Error: version '$version' does not match the required format v<major>.<minor>.<patch> (e.g. v1.0.0 or v1.0.0-beta.1)"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
        else
          echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Download all build artifacts
      uses: actions/download-artifact@v4.1.8
      with:
        path: artifacts/
        pattern: DakimakuraMod-*
        merge-multiple: false

    - name: Show downloaded files
      run: find artifacts -type f -maxdepth 5 | sort

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.value }}
        name: Release ${{ steps.tag.outputs.value }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: artifacts/**/*.jar
        fail_on_unmatched_files: true
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
