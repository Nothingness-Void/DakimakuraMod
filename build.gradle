def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

def configureSubprojectGradle = { Exec task, File dir, String gradleTask, File windowsPreferredJavaHome ->
    task.workingDir dir
    def cmd = isWindows ? ['cmd', '/c', 'gradlew.bat', gradleTask] : ['./gradlew', gradleTask]
    if (project.hasProperty('mod_version')) {
        cmd << "-Pmod_version=${project.property('mod_version')}"
    }
    task.commandLine cmd
    if (isWindows && windowsPreferredJavaHome != null && windowsPreferredJavaHome.exists()) {
        task.environment 'JAVA_HOME', windowsPreferredJavaHome.absolutePath
    }
}

def jdk17Home = new File('C:/Program Files/Java/jdk-17.0.3.1')
def jdk21Home = new File('C:/Program Files/Java/jdk-21')

tasks.register('buildMc1201', Exec) {
    def preferred = JavaVersion.current() != JavaVersion.VERSION_17 ? jdk17Home : null
    configureSubprojectGradle(it, file('mc1.20.1'), 'build', preferred)
}

tasks.register('buildMc1211', Exec) {
    def preferred = !JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21) ? jdk21Home : null
    configureSubprojectGradle(it, file('mc1.21.1'), 'build', preferred)
}

tasks.register('collectJars', Sync) {
    dependsOn buildMc1201, buildMc1211
    from('mc1.20.1/forge/build/libs') {
        include 'dakimakuramod-*+mc1.20.1-forge.jar'
    }
    from('mc1.20.1/fabric/build/libs') {
        include 'dakimakuramod-*+mc1.20.1-fabric.jar'
    }
    from('mc1.21.1/neoforge/build/libs') {
        include 'dakimakuramod-*+mc1.21.1-neoforge.jar'
    }
    from('mc1.21.1/fabric/build/libs') {
        include 'dakimakuramod-*+mc1.21.1-fabric.jar'
    }
    from('mc1.21.1/forge/build/libs') {
        include 'dakimakuramod-*+mc1.21.1-forge.jar'
    }
    into layout.buildDirectory.dir('libs')
}

tasks.register('assemble') {
    dependsOn collectJars
}

tasks.register('build') {
    dependsOn assemble
}

tasks.register('cleanMc1201', Exec) {
    def preferred = JavaVersion.current() != JavaVersion.VERSION_17 ? jdk17Home : null
    configureSubprojectGradle(it, file('mc1.20.1'), 'clean', preferred)
}

tasks.register('cleanMc1211', Exec) {
    def preferred = !JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21) ? jdk21Home : null
    configureSubprojectGradle(it, file('mc1.21.1'), 'clean', preferred)
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
    dependsOn cleanMc1201, cleanMc1211
}
